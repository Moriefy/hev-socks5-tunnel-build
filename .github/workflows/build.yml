name: Build hev-socks5-tunnel (arm64-v8a)

# 在 Ubuntu runner 上交叉编译 Android 可用的 libhev-socks5-tunnel.so。
# 本机是 aarch64 沙箱，跑 NDK 的 x86_64 clang 要过 qemu，编译大项目会被
# OOM Killer 杀掉（signal 9）；GitHub runner 内存充足，几分钟就能出包。

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 检出源码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 安装 Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: 写入 Application.mk（只出 arm64-v8a）
        run: |
          mkdir -p jni
          cat > jni/Application.mk <<'EOF'
          APP_OPTIM := release
          APP_PLATFORM := android-21
          APP_ABI := arm64-v8a
          APP_CFLAGS := -O2
          APP_SUPPORT_FLEXIBLE_PAGE_SIZES := true
          NDK_TOOLCHAIN_VERSION := clang
          EOF
          # ndk-build 需要 jni/Android.mk，把工程根的 Android.mk 链接进去
          ln -sf ../Android.mk jni/Android.mk
          ls -l jni/

      - name: 编译
        run: |
          ndk-build -j4 \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            NDK_APPLICATION_MK=./jni/Application.mk 2>&1 | tail -40

      - name: 检查产物
        run: |
          echo "=== libs ==="
          find libs -name '*.so' -exec ls -lh {} \; 2>/dev/null || true
          echo "=== obj ==="
          find obj -name '*.so' -exec ls -lh {} \; 2>/dev/null || true
          echo "=== 架构确认 ==="
          FILE=$(find libs -name 'libhev-socks5-tunnel.so' | head -1)
          [ -n "$FILE" ] && file "$FILE"

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: libhev-socks5-tunnel-arm64
          path: libs/arm64-v8a/*.so
          if-no-files-found: error
